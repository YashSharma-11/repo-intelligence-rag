services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repointel-postgres
    environment:
      POSTGRES_DB: repointel
      POSTGRES_USER: repointel
      POSTGRES_PASSWORD: repointel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repointel -d repointel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repointel-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
